# Push a branch named feature/** (or fix/**): tests run, a PR is opened and merged, and if VERSION is new a release is published.
name: ship
on:
  push:
    branches: ["feature/**", "fix/**"]
permissions:
  contents: write
  pull-requests: write
jobs:
  ship:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Tests
        run: |
          pip install python-osc numpy
          python -m unittest discover -s tests
      - name: Open and merge PR
        run: |
          BR="${GITHUB_REF_NAME}"
          TITLE="$(git log -1 --format=%s)"
          BODY="$(git log -1 --format=%b)"
          gh pr view "$BR" >/dev/null 2>&1 || gh pr create --base main --head "$BR" --title "$TITLE" --body "${BODY:-Automated PR}"
          gh pr merge "$BR" --merge --delete-branch
      - name: Release if VERSION is new
        run: |
          git fetch origin main && git checkout main && git pull -q origin main
          V="$(tr -d '[:space:]' < VERSION)"
          if gh release view "v$V" >/dev/null 2>&1; then echo "v$V already released"; exit 0; fi
          awk -v v="$V" '$0 ~ "^## "v"$"{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release v$V" > notes.md
          gh release create "v$V" --title "v$V" --notes-file notes.md --target main
